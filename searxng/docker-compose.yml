# SearXNG self-hosted - default source, old Yahoo as fallback.
# Enable JSON for SearXNG (most common gotcha): formats not enabled in settings.yml return 403.
# Test: curl "http://localhost:8080/search?q=test&format=json"
# Sample config mounted to /etc/searxng/settings.yml - docs: https://github.com/searxng/searxng/blob/master/docs/dev/search_api.rst
version: '3.8'
services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped
  # Optional: redis for caching (uncomment if needed)
  # redis:
  #   image: redis:alpine
  #   restart: unless-stopped
